name: quality
on:
  pull_request:
    branches: [main, work]
  push:
    branches: [main, work]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: harness_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U harness -d harness_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://harness:ci-only@127.0.0.1:5432/harness_test
      REQUIRE_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y openssl python3 bash
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
