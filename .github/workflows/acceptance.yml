name: Acceptance harness
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/acceptance/**', '.github/workflows/acceptance.yml']
permissions:
  contents: read
jobs:
  postgres-fault-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: harness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U harness -d harness_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://harness:test-only@localhost:5432/harness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p work/acceptance
      - run: node --import tsx scripts/acceptance/worker-crash.ts | tee work/acceptance/crash.jsonl
        shell: bash
      - run: |
          for n in 10 100 500; do
            SSE_CLIENTS=$n node --import tsx scripts/acceptance/sse-load.ts | tee work/acceptance/sse-$n.jsonl
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-reports
          path: work/acceptance
